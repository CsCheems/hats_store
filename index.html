<!doctype html>
<html lang="es-MX" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nicol Hats International — Sombreros de palma, lona y fieltro</title>
    <!-- El modo se fija ANTES del primer pintado, para que quien eligió oscuro no
         vea un destello claro. Sin elección guardada se parte del modo claro. -->
    <script>
      try {
        var tema = localStorage.getItem('nha-tema')
        if (tema === 'dark' || tema === 'light') document.documentElement.dataset.theme = tema
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Barlow:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
